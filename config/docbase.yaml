# チーム固有の既定値。
# ここを書き換えれば、アシスタントの提案する初期値が変わります。
# （分からない項目はそのままで構いません。担当者に毎回確認されます。）

defaults:
  # 常に自動で付与するタグ。マニュアルを一覧で探しやすくするためのもの。
  tags:
    - 業務マニュアル

  # 公開範囲: everyone（チーム全員） / group（特定グループのみ） / private（自分だけ）
  scope: everyone

  # scope が group のときに公開するグループ名。
  # 実際のグループ ID は searchGroups で解決されます。
  group_name: ""

  # true にすると DocBase の「下書き」として投稿されます（テスト時に便利）。
  draft: false

  # タイトルの先頭に自動で付ける文字列。不要なら "" にしてください。
  title_prefix: "【マニュアル】"

  # 更新時にチームへ通知するか。false なら通知なしで静かに更新されます。
  # 誤字修正など細かい更新で毎回通知が飛ぶのを防ぐため、既定は false です。
  notice: false
